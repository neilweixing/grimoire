name: Commit messages

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: commit-messages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Commit message format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate introduced commit messages
        run: node scripts/check-commit-messages.mjs --ci
