name: Publish release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag matching the desktop package version
        required: true
        default: v0.1.2
        type: string
      build_run_id:
        description: Successful Desktop installers workflow run ID
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      build_run_id:
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified installers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Verify source build
        id: source
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build-run.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('A stable version tag such as v0.1.0 is required.')
          run = json.loads(Path(os.environ['RUNNER_TEMP'], 'build-run.json').read_text())
          assert run['repository']['full_name'] == os.environ['GH_REPO']
          assert run['path'] == '.github/workflows/desktop-build.yml'
          assert run['event'] in ('push', 'workflow_dispatch')
          assert run['head_branch'] in ('main', tag)
          # A reusable release job runs after both package jobs in the same run.
          same_run = os.environ['BUILD_RUN_ID'] == os.environ['CURRENT_RUN_ID']
          if not same_run:
              assert run['status'] == 'completed' and run['conclusion'] == 'success'
          sha = run['head_sha']
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Verify version
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('apps/grimoire-desktop/package.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag and desktop version must match.'
          PY
          comparison=$(gh api "repos/$GH_REPO/compare/$SOURCE_SHA...$RELEASE_TAG" --jq .status)
          [[ "$comparison" == identical ]] || { echo 'The release tag must point to the verified build commit.' >&2; exit 1; }
      - name: Retrieve macOS installer
        uses: actions/download-artifact@v4
        with:
          name: Grimoire-macOS-arm64
          path: release-assets
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Retrieve Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Grimoire-Windows-x64
          path: release-assets
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Prepare checksums and release notes
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          version = os.environ['RELEASE_TAG'][1:]
          assets = Path('release-assets')
          names = [f'Grimoire-{version}-arm64.dmg', f'Grimoire-{version}-arm64.zip', f'Grimoire-{version}-x64.msi', f'Grimoire-{version}-x64-setup.exe', 'latest-mac.yml', 'latest.yml']
          checksums = []
          for name in names:
              assert (assets / name).is_file(), f'Missing release asset: {name}'
          for name in sorted(path.name for path in assets.iterdir() if path.is_file()):
              path = assets / name
              assert path.is_file() and path.stat().st_size > 0, f'Missing installer: {name}'
              checksums.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {name}\n')
          (assets / 'SHA256SUMS.txt').write_text(''.join(checksums))
          notes = f'''Desktop coding agent powered by the native Pi SDK and assistant-ui.

          ## Downloads

          - macOS Apple Silicon: `Grimoire-{version}-arm64.dmg`
          - Windows x64: `Grimoire-{version}-x64-setup.exe` (in-app updates) or `Grimoire-{version}-x64.msi` (manual updates)
          - `SHA256SUMS.txt`: SHA-256 checksums for both installers.

          Application data, provider credentials, and local project folders are not included.

          ## Current limitations

          - Installers are unsigned; the operating system may display publisher or trust warnings.
          - The app checks for releases in the background. Downloading requires clicking Update. After downloading, choose Quit and update or Later; supported installations apply the update on the next normal quit.
          - Unsigned Apple Silicon macOS builds install updates on normal quit through a verified local replacement helper; the app must be installed in a writable folder outside a mounted DMG. Older versions without the helper need one manual upgrade. MSI installations still require manual installation.
          - ZIP, blockmap, and latest*.yml assets support the update client.
          - Windows shell execution requires explicitly confirmed Full access; a native Windows sandbox is not enabled.

          Both installers passed startup checks, including an actual MSI installation on Windows.
          Build: https://github.com/{os.environ['GH_REPO']}/actions/runs/{os.environ['BUILD_RUN_ID']}
          '''
          # Remove YAML indentation from the Markdown paragraphs.
          notes = '\n'.join(line.lstrip() for line in notes.splitlines())
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(notes + '\n')
          PY
      - name: Publish release with installers
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            jq -e '.isDraft == true' "$RUNNER_TEMP/existing-release.json" > /dev/null || { echo 'This version is already published; use a new version tag.' >&2; exit 1; }
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GH_REPO" --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          fi
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --latest
